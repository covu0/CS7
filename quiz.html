<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كويزات الميد · محارب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#FAFBFA;--card:#FFFFFF;--ink:#16231F;--muted:#6B7A75;--faint:#9AA7A3;--line:#E4EAE7;--acc:#1F6B52;--soft:#EFF5F2;--gold:#A66A0A;
--ok:#1F7A4D;--okbg:#E8F5EE;--bad:#B3261E;--badbg:#FBECEA;
--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){
:root{--bg:#0A100E;--card:#101815;--ink:#E9F0ED;--muted:#8DA19A;--faint:#62746E;--line:#1E2A26;--acc:#6FC8A5;--soft:#12211C;--gold:#D9A54A;
--ok:#6FC8A5;--okbg:#10261D;--bad:#F2928A;--badbg:#2A1513}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","IBM Plex Sans",Tahoma,sans-serif;font-size:16.5px;line-height:1.9}
.wrap{max-width:680px;margin-inline:auto;padding-inline:16px;padding-block:20px 72px}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px;min-height:38px}
.crumb{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-weight:500;font-size:.95rem}
.crumb:hover{color:var(--acc)}
.head{text-align:center;padding:6px 0 0;margin-bottom:28px}
.head .lab{font-family:var(--mono);letter-spacing:.3em;font-size:.72rem;color:var(--faint);direction:ltr}
.head h1{font-size:2.3rem;line-height:1.3;margin:10px 0 4px;font-weight:700}
.head h1 em{font-style:normal;color:var(--gold)}
.head p{color:var(--muted);margin:0;font-size:.95rem}
.box{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:20px}
.lbl{color:var(--faint);font-size:.82rem;font-weight:500;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 16px;font-size:.92rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--soft);border-color:var(--acc);color:var(--acc);font-weight:600}
.chip small{font-family:var(--mono);opacity:.7;margin-inline-start:8px;unicode-bidi:isolate}
.chip.warn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:transparent}
.go{display:block;width:100%;border:0;border-radius:14px;background:var(--acc);color:#fff;font-weight:600;font-size:1.05rem;padding:12px}
@media (prefers-color-scheme:dark){.go{color:#0A100E}}
.go:disabled{opacity:.4;cursor:default}
.ghost{display:block;width:100%;border:1px solid var(--line);background:transparent;border-radius:14px;font-weight:600;padding:11px;margin-top:10px;color:var(--acc)}
.prog{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.bar{flex:1;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .25s}
.cnt{font-family:var(--mono);font-size:.85rem;color:var(--muted);direction:ltr}
.tag{display:inline-block;font-size:.78rem;color:var(--acc);background:var(--soft);border-radius:999px;padding:0 12px;margin-bottom:12px}
.q{direction:ltr;text-align:left;font-family:"IBM Plex Sans","IBM Plex Sans Arabic",sans-serif;font-size:1.08rem;line-height:1.7;font-weight:500;margin:0 0 18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;direction:ltr;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 14px;font-family:"IBM Plex Sans",sans-serif;line-height:1.6}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.opt:not(:disabled):hover{border-color:var(--acc)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:var(--card)}
.tf{flex-direction:row}
.tf .opt{justify-content:center;font-weight:600}
.ex{margin-top:16px;border-radius:14px;padding:12px 16px;background:var(--soft);font-size:.96rem}
.ex b{display:block;font-size:.9rem}
.ex.good b{color:var(--ok)} .ex.no b{color:var(--bad)}
.mono{font-family:var(--mono);font-size:.92em;direction:ltr;unicode-bidi:isolate}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 2px;font-size:.88em}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 3px}
.score{text-align:center;padding:10px 0 4px}
.score .big{font-family:var(--mono);font-size:3.2rem;font-weight:600;color:var(--gold);line-height:1.1;direction:ltr}
.score p{color:var(--muted);margin:6px 0 0}
.tops{margin:18px 0 6px;display:flex;flex-direction:column;gap:8px}
.tops div{display:flex;justify-content:space-between;gap:10px;font-size:.93rem;border-bottom:1px solid var(--line);padding-bottom:6px}
.tops span:last-child{font-family:var(--mono);direction:ltr}
.miss{margin-top:20px}
.miss h3{font-size:1rem;margin:0 0 10px}
.mi{border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px}
.mi .q{font-size:.95rem;margin:0 0 6px}
.mi .ans{direction:ltr;text-align:left;color:var(--ok);font-weight:600;font-size:.93rem}
.mi .ex{margin-top:8px;font-size:.9rem;padding:8px 12px}
[hidden]{display:none!important}
html[lang="en"] body{font-family:"IBM Plex Sans","IBM Plex Sans Arabic","Segoe UI",sans-serif;line-height:1.7}
.lang{display:inline-flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:3px;margin-inline-start:auto}
.lang button{border:0;background:transparent;border-radius:999px;padding:2px 15px;color:var(--faint);font-weight:500;font-size:.84rem;line-height:1.8}
.lang button[aria-pressed="true"]{background:var(--soft);color:var(--acc);font-weight:600}
html[lang="en"] .ex,html[lang="en"] .lbl,html[lang="en"] .miss h3{text-align:left}
</style>
</head>
<body>
<div class="wrap">
<div class="topbar"><a class="crumb" id="back" href="./"></a><div class="lang"><button data-l="ar">عربي</button><button data-l="en">English</button></div></div>
<div class="head"><div class="lab">MIDTERM QUIZ</div><h1><span data-t="quiz"></span> <em id="hcode"></em></h1><p data-t="sub"></p></div>

<section id="setup" class="box">
<p class="lbl" data-t="topics"></p>
<div class="chips" id="topics"></div>
<p class="lbl" data-t="count"></p>
<div class="chips" id="counts"></div>
<button class="ghost" id="missBtn" hidden style="margin:0 0 12px;border-color:var(--gold);color:var(--gold)"></button>
<button class="go" id="start" data-t="start"></button>
<p class="lbl" id="noStore" hidden style="margin:12px 0 0;text-align:center" data-t="nostore"></p>
</section>

<section id="play" class="box" hidden>
<div class="prog"><div class="bar"><i id="barI"></i></div><span class="cnt" id="cnt"></span></div>
<span class="tag" id="tag"></span>
<p class="q" id="qText"></p>
<div class="opts" id="opts"></div>
<div class="ex" id="ex" hidden></div>
<button class="go" id="next" hidden style="margin-top:16px"></button>
</section>

<section id="done" class="box" hidden>
<div class="score"><div class="big" id="sc"></div><p id="scMsg"></p></div>
<div class="tops" id="tops"></div>
<button class="go" id="retry" data-t="retry"></button>
<button class="ghost" id="again" data-t="again"></button>
<div class="miss" id="miss"></div>
</section>
</div>

<script>
const F=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const M=s=>`<span class="mono">${s}</span>`;
let QUIZ=null,TOPICS,BANK,MKEY;
const CID=(new URLSearchParams(location.search).get("c")||"math317").replace(/[^a-z0-9]/g,"");


const $=id=>document.getElementById(id);
const S={
 ar:{quiz:"كويز",sub:"اختيارات وصح وخطأ من الملخصات والميدات",topics:"المواضيع",count:"عدد الأسئلة",all:"الكل",start:"ابدأ",miss:n=>`راجع أخطائي السابقة (${n})`,
  nostore:"متصفحك ما يسمح بحفظ الأخطاء (غالباً تصفح خاص). الكويز يشتغل عادي بس الأخطاء تنمسح لما تحدّث.",tf:" · صح وخطأ",ok:"صح",no:"غلط",next:"التالي",result:"النتيجة",
  retry:"أعد الأسئلة اللي غلطت فيها",again:"كويز جديد",wrong:"اللي غلطت فيه",na:"الكويز غير متوفر",
  msg:p=>p===1?"فل مارك":p>=.8?"ممتاز، راجع اللي غلطت فيه":p>=.5?"زين، بس راجع الغلط":"ارجع للملخص وبعدها عيد"},
 en:{quiz:"Quiz",sub:"Multiple choice and true/false from the notes and past midterms",topics:"Topics",count:"Number of questions",all:"All",start:"Start",miss:n=>`Review my past mistakes (${n})`,
  nostore:"Your browser does not allow saving mistakes (probably private browsing). The quiz still works, but mistakes are cleared on refresh.",tf:" · True/False",ok:"Correct",no:"Wrong",next:"Next",result:"Result",
  retry:"Retry the questions I got wrong",again:"New quiz",wrong:"What I got wrong",na:"Quiz not available",
  msg:p=>p===1?"Full marks":p>=.8?"Excellent, review the ones you missed":p>=.5?"Good, but review your mistakes":"Go back to the notes, then try again"}};
let L="ar";try{const v=localStorage.getItem("lang");if(v==="en"||v==="ar")L=v}catch(e){}
const t=k=>S[L][k];
const EX=q=>L==="en"&&QUIZ.ee&&QUIZ.ee[q.id]?QUIZ.ee[q.id]:q.e;
let answered=false;
const CK=k=>{const m=document.cookie.match(new RegExp("(?:^|; )"+k+"=([^;]*)"));return m?decodeURIComponent(m[1]):null};
const store={
  get(k){let v=null;try{v=localStorage.getItem(k)}catch(e){}if(!v)v=CK(k);try{return JSON.parse(v||"[]")}catch(e){return[]}},
  set(k,v){const j=JSON.stringify(v);try{localStorage.setItem(k,j)}catch(e){}try{document.cookie=k+"="+encodeURIComponent(j)+";max-age=31536000;path=/;SameSite=Lax"}catch(e){}}};
const canStore=(()=>{try{localStorage.setItem("_t","1");const ok=localStorage.getItem("_t")==="1";localStorage.removeItem("_t");if(ok)return true}catch(e){}try{document.cookie="_t=1;path=/";return /(^|; )_t=1/.test(document.cookie)}catch(e){return false}})();
let sel=new Set(),count=10,useMissed=false,list=[],i=0,right=0,wrong=[];
function shuffle(a){a=a.slice();for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a}
function chip(txt,on,fn,cls=""){const b=document.createElement("button");b.className="chip "+cls;b.innerHTML=txt;b.setAttribute("aria-pressed",on);b.onclick=fn;return b}
function drawSetup(){
  const T=$("topics");T.innerHTML="";
  const missed=store.get(MKEY).filter(id=>BANK.some(q=>q.id===id));
  const mb=$("missBtn");mb.hidden=!missed.length;mb.textContent=t("miss")(missed.length);
  $("noStore").hidden=canStore;
  for(const k in TOPICS){const n=BANK.filter(q=>q.t===k).length;
    T.append(chip(`${TOPICS[k]}<small>${n}</small>`,sel.has(k),()=>{sel.has(k)?sel.delete(k):sel.add(k);drawSetup()}))}
  const C=$("counts");C.innerHTML="";
  for(const c of [10,20,0])C.append(chip(c?String(c):t("all"),count===c,()=>{count=c;drawSetup()}));
  $("start").disabled=sel.size===0;
}
function start(qs){list=qs;i=0;right=0;wrong=[];$("setup").hidden=true;$("done").hidden=true;$("play").hidden=false;show()}
$("start").onclick=()=>{let pool=shuffle(BANK.filter(q=>sel.has(q.t)));if(count)pool=pool.slice(0,count);start(pool)};
$("missBtn").onclick=()=>{const m=store.get(MKEY);start(shuffle(BANK.filter(q=>m.includes(q.id))))};
function show(){
  const q=list[i];$("cnt").textContent=`${i+1} / ${list.length}`;$("barI").style.width=(i/list.length*100)+"%";
  $("tag").innerHTML=TOPICS[q.t]+(q.k==="tf"?t("tf"):"");answered=false;
  $("qText").innerHTML=q.q;$("ex").hidden=true;$("next").hidden=true;
  const O=$("opts");O.innerHTML="";O.className="opts"+(q.k==="tf"?" tf":"");
  let items;
  if(q.k==="tf")items=[{h:"True",ok:q.a===true},{h:"False",ok:q.a===false}];
  else items=shuffle(q.o.map((h,j)=>({h,ok:j===q.a})));
  items.forEach((it,j)=>{const b=document.createElement("button");b.className="opt";
    b.innerHTML=(q.k==="tf"?"":`<span class="k">${"ABCD"[j]}</span>`)+`<span>${it.h}</span>`;
    b.onclick=()=>pick(b,it.ok,items);O.append(b)});
}
function pick(btn,ok,items){
  const q=list[i],bs=[...$("opts").children];
  bs.forEach((b,j)=>{b.disabled=true;if(items[j].ok)b.classList.add("ok")});
  if(!ok)btn.classList.add("bad");
  let m=store.get(MKEY);
  if(ok){right++;m=m.filter(x=>x!==q.id)}else{wrong.push(q);if(!m.includes(q.id))m.push(q.id)}
  store.set(MKEY,m);
  answered=ok?"ok":"no";drawEx();$("next").hidden=false;
}
function drawEx(){const q=list[i],ex=$("ex");ex.className="ex "+(answered==="ok"?"good":"no");ex.innerHTML=`<b>${t(answered)}</b>${EX(q)}`;ex.hidden=false;
  $("next").textContent=i===list.length-1?t("result"):t("next")}
$("next").onclick=()=>{i++;if(i<list.length)show();else finish()};
function ansText(q){return q.k==="tf"?(q.a?"True":"False"):q.o[q.a]}
function finish(){$("play").hidden=true;$("done").hidden=false;renderDone()}
function renderDone(){
  $("sc").textContent=`${right} / ${list.length}`;
  const p=right/list.length;
  $("scMsg").textContent=t("msg")(p);
  const by={};list.forEach(q=>{by[q.t]=by[q.t]||[0,0];by[q.t][1]++});list.forEach(q=>{if(!wrong.includes(q))by[q.t][0]++});
  $("tops").innerHTML=Object.keys(by).map(k=>`<div><span>${TOPICS[k]}</span><span>${by[k][0]} / ${by[k][1]}</span></div>`).join("");
  $("retry").hidden=!wrong.length;
  $("miss").innerHTML=wrong.length?`<h3>${t("wrong")}</h3>`+wrong.map(q=>`<div class="mi"><p class="q">${q.q}</p><div class="ans">✓ ${ansText(q)}</div><div class="ex">${EX(q)}</div></div>`).join(""):"";
}
$("retry").onclick=()=>start(shuffle(wrong));
$("again").onclick=()=>{$("done").hidden=true;$("setup").hidden=false;drawSetup()};
function applyLang(){
  document.documentElement.lang=L;document.documentElement.dir=L==="ar"?"rtl":"ltr";
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===L));
  document.querySelectorAll("[data-t]").forEach(el=>{const v=S[L][el.dataset.t];if(typeof v==="string")el.textContent=v});
  if(!QUIZ)return;
  document.title=t("quiz")+" "+QUIZ.code+" · محارب";
  const bk=$("back");bk.href="./#"+QUIZ.id;bk.textContent=(L==="ar"?"→ ":"← ")+QUIZ.code;
  if(!$("setup").hidden)drawSetup();
  if(!$("play").hidden){const q=list[i];$("tag").innerHTML=TOPICS[q.t]+(q.k==="tf"?t("tf"):"");if(answered)drawEx()}
  if(!$("done").hidden)renderDone();
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem("lang",L)}catch(e){}applyLang()});
function boot(){
  if(!QUIZ){applyLang();$("setup").innerHTML=`<p style="text-align:center;margin:0">${t("na")}</p>`;return}
  TOPICS=QUIZ.topics;BANK=QUIZ.bank;MKEY="quiz-"+QUIZ.id+"-missed";sel=new Set(Object.keys(TOPICS));
  $("hcode").textContent=QUIZ.code;
  applyLang();drawSetup();
}
const ds=document.createElement("script");ds.src="quiz/"+CID+".js?v=4";ds.onload=boot;ds.onerror=boot;document.body.append(ds);
</script>
</body>
</html>
