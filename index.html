<style>
/* Calm system: one accent, thin lines, generous space. Gold appears only on the title word and the countdown number. */
:root{--bg:#FAFBFA;--card:#FFFFFF;--ink:#16231F;--muted:#6B7A75;--faint:#9AA7A3;--line:#E4EAE7;--acc:#1F6B52;--soft:#EFF5F2;--gold:#A66A0A;
--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){
:root{--bg:#0A100E;--card:#101815;--ink:#E9F0ED;--muted:#8DA19A;--faint:#62746E;--line:#1E2A26;--acc:#6FC8A5;--soft:#12211C;--gold:#D9A54A}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","IBM Plex Sans",Tahoma,sans-serif;font-size:16.5px;line-height:1.9}
html[lang="en"] body{font-family:"IBM Plex Sans","IBM Plex Sans Arabic","Segoe UI",sans-serif;line-height:1.7}
.wrap{max-width:820px;margin-inline:auto;padding-inline:22px;padding-block:20px 72px}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
.n{font-family:var(--mono);color:var(--acc);font-size:.78rem;font-weight:600;letter-spacing:.14em;direction:ltr;flex:none}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:34px;min-height:38px}
.crumb{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-weight:500;font-size:.95rem;transition:color .15s}
.crumb:hover{color:var(--acc)}
.lang{display:inline-flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:3px;margin-inline-start:auto}
.lang button{border:0;background:transparent;border-radius:999px;padding:2px 15px;color:var(--faint);font-weight:500;font-size:.84rem;line-height:1.8;transition:background .15s,color .15s}
.lang button:focus-visible{border-radius:999px}
.lang button[aria-pressed="true"]{background:var(--soft);color:var(--acc);font-weight:600}

.head{text-align:center;padding:14px 0 6px;margin-bottom:38px}
.head .lab{font-family:var(--mono);letter-spacing:.3em;font-size:.72rem;color:var(--faint);direction:ltr}
.head h1{font-size:2.7rem;line-height:1.3;margin:14px 0 6px;font-weight:700}
.head h1 em{font-style:normal;color:var(--gold)}
.head .sig{color:var(--muted);font-size:.95rem;font-family:"IBM Plex Sans Arabic",sans-serif}

.next{display:flex;align-items:center;gap:20px;flex-wrap:wrap;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:20px 26px;margin-bottom:44px}
.next .big{font-family:var(--mono);font-size:2.6rem;font-weight:600;color:var(--gold);line-height:1;direction:ltr}
.next .t{flex:1;min-width:180px}
.next .t b{display:block;font-size:1.08rem;font-weight:600}
.next .t span{color:var(--muted);font-size:.9rem}
.next a{color:var(--acc);font-weight:600;font-size:.95rem;border:1px solid var(--line);border-radius:999px;padding:4px 18px;transition:border-color .15s,background .15s}
.next a:hover{border-color:var(--acc);background:var(--soft)}

.strip{color:var(--faint);font-size:.82rem;font-weight:500;letter-spacing:.04em;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.course{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:18px;padding:22px 22px 20px;background:var(--card);transition:border-color .18s,transform .18s;min-width:0}
a.course:hover{border-color:var(--acc);transform:translateY(-2px)}
.course .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.course .ico{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--acc)}.course .ico svg{width:20px;height:20px}
.ico svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
.course .name{font-weight:600;font-size:1.22rem;line-height:1.5}
.course .meta{color:var(--muted);font-size:.88rem}
.course .meta b{font-weight:600;color:var(--ink)}
.pill{font-size:.82rem;color:var(--faint);margin-top:8px}
.pill.on{color:var(--acc);font-weight:500}
.course.off{opacity:.55}

.bar{margin-bottom:8px}
.bar h2{margin:6px 0 0;font-size:2.1rem;line-height:1.4;font-weight:700}
.info{color:var(--muted);margin:0 0 40px;font-size:.92rem}
.secs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.sec{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:1px solid var(--line);border-radius:18px;padding:24px 22px 20px;background:var(--card);transition:border-color .18s,transform .18s;min-width:0}
a.sec:hover{border-color:var(--acc);transform:translateY(-2px)}
.sec .ico,.sechead .ico{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:13px;background:var(--soft);color:var(--acc);flex:none}.sec .ico svg,.sechead .ico svg{width:22px;height:22px}
.sec .ico{margin-bottom:12px}
.sec .name{font-weight:600;font-size:1.22rem;line-height:1.5}
.sec .desc{color:var(--muted);font-size:.88rem;line-height:1.75;flex:1}
.sec.off{opacity:.55}
.sechead{display:flex;align-items:center;gap:14px;margin:0 0 22px}
.sechead h3{margin:0;font-size:1.4rem;line-height:1.5;font-weight:600}
.sechead small{margin-inline-start:auto;color:var(--faint);font-size:.84rem}
.file{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:16px;margin-bottom:12px;background:var(--card);overflow:hidden;transition:border-color .18s}
.file:hover{border-color:var(--acc)}
.file .open{flex:1;min-width:0;display:flex;align-items:center;gap:16px;padding:16px 20px}
.file .n{color:var(--faint);letter-spacing:0;font-weight:400;font-size:.82rem}
.file .tt{flex:1;min-width:0}
.file .tt b{display:block;font-size:1.04rem;font-weight:600;overflow-wrap:anywhere}
.file .tt span{color:var(--muted);font-size:.85rem}
.file .pg{font-size:.78rem;color:var(--faint);white-space:nowrap}
.file .go{color:var(--acc);font-size:1.2rem;line-height:1}
.file .sol{display:flex;align-items:center;padding:0 20px;border-inline-start:1px solid var(--line);color:var(--acc);font-weight:500;font-size:.9rem;white-space:nowrap;transition:background .15s}
.file .sol:hover{background:var(--soft)}
.file .only{font-size:.72rem;color:var(--faint);white-space:nowrap}
footer{margin-top:64px;text-align:center;color:var(--faint);font-size:.8rem}
@media (max-width:520px){.wrap{padding-inline:18px}.head h1{font-size:2.2rem}.bar h2{font-size:1.75rem}.file .pg{display:none}.file .open{gap:12px;padding:15px 16px}.file .sol{padding:0 15px}
.secs{grid-template-columns:1fr;gap:12px}.sec{display:grid;grid-template-columns:auto 1fr auto;column-gap:16px;row-gap:0;align-items:center;padding:16px 18px}.sec .ico{grid-row:1 / span 2;margin-bottom:0}.sec .name{font-size:1.12rem}.sec .desc{grid-column:2;font-size:.83rem}.sec .pill{grid-column:3;grid-row:1 / span 2;margin-top:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;transform:none!important}}
</style>
